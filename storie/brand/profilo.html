<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg id="v" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const C={bg1:'#14163a',bg2:'#262a5c',door:'#5a4a8a',doorD:'#4a3c75',frame:'#1e1d3a',amber:'#ffc86b',amberL:'#ffe0a3',go:'#1fa64a',stop:'#e0302f',red:'#ff3b3b',white:'#f6f3ff'};
const defs=`<defs><radialGradient id="bg" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="${C.bg2}"/><stop offset="1" stop-color="${C.bg1}"/></radialGradient>
<linearGradient id="spill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.amber}" stop-opacity=".75"/><stop offset="1" stop-color="${C.amber}" stop-opacity="0"/></linearGradient>
<radialGradient id="glowR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${C.red}" stop-opacity=".45"/><stop offset="1" stop-color="${C.red}" stop-opacity="0"/></radialGradient></defs>`;
const V={
// 1. porta socchiusa con luce + pillole A/B
door:()=>`<rect width="1080" height="1080" fill="url(#bg)"/>
<rect x="330" y="170" width="420" height="640" fill="${C.frame}" rx="10"/>
<polygon points="360,200 720,200 720,800 360,800" fill="#ffd994"/>
<polygon points="360,200 610,240 610,770 360,800" fill="${C.door}"/><polygon points="540,228 610,240 610,770 540,780" fill="${C.doorD}"/>
<circle cx="580" cy="520" r="16" fill="${C.amber}"/>
<polygon points="610,800 720,800 900,1080 560,1080" fill="url(#spill)"/>
<g transform="translate(540,900)"><rect x="-310" y="-62" width="290" height="124" rx="62" fill="${C.go}"/><text x="-165" y="30" font-family="Inter" font-weight="900" font-size="96" fill="${C.white}" text-anchor="middle">A</text>
<rect x="20" y="-62" width="290" height="124" rx="62" fill="${C.stop}"/><text x="165" y="30" font-family="Inter" font-weight="900" font-size="96" fill="${C.white}" text-anchor="middle">B</text></g>`,
// 2. monogramma A/B
mono:()=>`<rect width="1080" height="1080" fill="url(#bg)"/><circle cx="540" cy="540" r="420" fill="url(#glowR)"/>
<text x="330" y="690" font-family="Inter" font-weight="900" font-size="460" fill="${C.go}" text-anchor="middle">A</text>
<text x="760" y="690" font-family="Inter" font-weight="900" font-size="460" fill="${C.stop}" text-anchor="middle">B</text>
<polygon points="590,250 650,250 500,840 440,840" fill="${C.white}"/>
<rect x="250" y="800" width="580" height="18" rx="9" fill="${C.amberL}" opacity=".9"/>`,
// 3. buco della serratura con A/B dentro
keyhole:()=>`<rect width="1080" height="1080" fill="#0f1129"/><circle cx="540" cy="540" r="470" fill="url(#bg)"/>
<circle cx="540" cy="420" r="210" fill="${C.amberL}"/><polygon points="430,520 650,520 760,900 320,900" fill="${C.amberL}"/>
<circle cx="540" cy="420" r="160" fill="${C.amber}"/><polygon points="460,520 620,520 700,860 380,860" fill="${C.amber}"/>
<text x="460" y="500" font-family="Inter" font-weight="900" font-size="190" fill="${C.go}" text-anchor="middle">A</text>
<text x="625" y="500" font-family="Inter" font-weight="900" font-size="190" fill="${C.stop}" text-anchor="middle">B</text>
<circle cx="540" cy="700" r="46" fill="#14163a"/><circle cx="552" cy="690" r="14" fill="${C.white}"/>`
};
window.draw=(k)=>{document.getElementById('v').innerHTML=defs+V[k]();};
</script></body></html>
